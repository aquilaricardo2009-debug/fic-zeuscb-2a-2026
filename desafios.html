<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="desafios.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade JavaScript</title>
</head>
<body>

</head>
<body>

<div class="container">

<h1>Atividade JavaScript</h1>

<h2>Cadastro</h2>

<input type="text" id="nome" placeholder="Nome">

<input type="number" id="idade" placeholder="Idade">

<input type="number" id="nota1" placeholder="Nota 1">

<input type="number" id="nota2" placeholder="Nota 2">

<button onclick="cadastrar()">Cadastrar</button>

<h2>Lista</h2>

<table>
<tr>
<th>Nome</th>
<th>Idade</th>
<th>Média</th>
<th>Status</th>
</tr>

<tbody id="lista"></tbody>

</table>

<h3>Maiores de 18 anos</h3>

<p id="maiores"></p>

<hr>

<h2>Split</h2>

<input type="text" id="nomes" placeholder="Ex: Ana,Pedro,Carlos">

<button onclick="separar()">Separar</button>

<p id="resultadoSplit"></p>

<hr>

<h2>Switch</h2>

<input type="number" id="dia" placeholder="1-7">

<button onclick="mostrarDia()">Mostrar</button>

<p id="resultadoDia"></p>

<hr>

<h2>Boca de Urna</h2>

<button onclick="votacao()">Iniciar</button>

<p id="votos"></p>

<hr>

<h2>Mini Calculadora</h2>

<input type="number" id="n1">

<select id="op">
<option>+</option>
<option>-</option>
<option>*</option>
<option>/</option>
</select>

<input type="number" id="n2">

<button onclick="calcular()">Calcular</button>

<p id="calc"></p>

<hr>

<h2>Ordenar Nomes</h2>

<button onclick="ordenar()">Ordenar</button>

<p id="ordenados"></p>

<hr>

<h2>Eventos</h2>

<button onclick="trocarCor()">Trocar Cor</button>

<button onclick="trocarImagem()">Trocar Imagem</button>

<button onclick="mostrarTexto()">Mostrar/Esconder Texto</button>

<button onclick="mostrarData()">Mostrar Data</button>

<br><br>

<img id="imagem" src="https://picsum.photos/200">

<p id="texto">Texto de exemplo</p>

<p id="data"></p>

</div>


<script src="desafios.js"></script>
</body>
</html>
