<!DOCTYPE html>
<html lang="en">
<head>
        <title>calculadora</title>
        <link rel="stylesheet" href="style.css">
</head>
<body id="body">
  <div class="calculadora">
    <input type="text" class="tela" id="tela">
       <div class="button">
        <button onclick="limpar('')" id="buttonc">c</button>
         <button onclick="calcula('1')"id="button">1</button>
         <button onclick="calcula('2')"id="button">2</button>
         <button onclick="calcula('3')"id="button">3</button>
         <button onclick="calcula('4')"id="button">4</button>
         <button onclick="calcula('5')"id="button">5</button>
         <button onclick="calcula('6')"id="button">6</button>
         <button onclick="calcula('7')"id="button">7</button>
         <button onclick="calcula('8')"id="button">8</button>
         <button onclick="calcula('9')"id="button">9</button>
         <button onclick="calcula('0')"id="button">0</button>
         <button onclick="calcula('+')"id="button">+</button>
         <button onclick="calcula('-')"id="button">-</button>
         <button onclick="calcula('*')"id="button">*</button>
         <button onclick="calcula('/')"id="button">/</button>
         <button onclick="resultado()"id="button">=</button>
       </div>
  </div>
</body>
<script src="javascript.js"></script>
</html>
